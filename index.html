<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz - Higienização das Mãos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #46178f 0%, #7c2dc7 50%, #e91e63 100%);
    min-height: 100vh;
    color: white;
    overflow-x: hidden;
    padding: 10px;
  }
  
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 15px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .screen { display: none; animation: fadeIn 0.4s ease; }
  .screen.active { display: block; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  
  h1 {
    font-size: 2rem;
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  
  h2 {
    font-size: 1.5rem;
    text-align: center;
    margin-bottom: 15px;
  }
  
  .subtitle {
    text-align: center;
    font-size: 1rem;
    opacity: 0.9;
    margin-bottom: 25px;
  }
  
  input[type="text"] {
    width: 100%;
    padding: 15px;
    font-size: 1.1rem;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.95);
    color: #333;
    margin-bottom: 15px;
    text-align: center;
    font-weight: 600;
  }
  
  input[type="text"]:focus { outline: 3px solid #ffd700; }
  
  .btn {
    width: 100%;
    padding: 18px;
    font-size: 1.2rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    color: white;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  
  .btn-primary { background: #26890c; }
  .btn-secondary { background: #e91e63; }
  .btn-warning { background: #ff9800; }
  .btn-info { background: #2196f3; }
  
  /* Quiz Screen */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding: 10px;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
  }
  
  .timer {
    font-size: 2rem;
    font-weight: 900;
    color: #ffd700;
    min-width: 70px;
    text-align: center;
  }
  
  .timer.danger { color: #ff4444; animation: pulse 0.5s infinite; }
  
  .question-counter {
    font-size: 1rem;
    font-weight: 600;
  }
  
  .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ff9800);
    transition: width 1s linear;
    width: 100%;
  }
  
  .question-box {
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 25px 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  
  .option {
    padding: 20px 10px;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: all 0.2s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    position: relative;
  }
  
  .option:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  
  .option.red { background: #e21b30; }
  .option.blue { background: #1368ce; }
  .option.yellow { background: #d89e00; color: #333; }
  .option.green { background: #26890c; }
  
  .option.correct { background: #4caf50 !important; animation: pulse 0.5s; }
  .option.wrong { background: #757575 !important; opacity: 0.6; }
  .option:disabled { cursor: not-allowed; }
  
  /* Result Screen */
  .result-card {
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 30px 20px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 20px;
  }
  
  .result-emoji { font-size: 4rem; margin-bottom: 10px; }
  
  .points-gained {
    font-size: 3rem;
    font-weight: 900;
    color: #46178f;
    margin: 10px 0;
  }
  
  .result-label {
    font-size: 1rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  
  /* Ranking */
  .ranking-list {
    background: rgba(255,255,255,0.95);
    color: #333;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    max-height: 50vh;
    overflow-y: auto;
  }
  
  .ranking-item {
    display: flex;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid #eee;
    gap: 10px;
  }
  
  .ranking-item:last-child { border-bottom: none; }
  
  .rank-position {
    font-size: 1.5rem;
    font-weight: 900;
    min-width: 40px;
    text-align: center;
  }
  
  .rank-1 { color: #ffd700; }
  .rank-2 { color: #c0c0c0; }
  .rank-3 { color: #cd7f32; }
  
  .rank-name {
    flex: 1;
    font-weight: 600;
    font-size: 1rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .rank-score {
    font-weight: 700;
    color: #46178f;
    font-size: 1.1rem;
  }
  
  .empty-ranking {
    text-align: center;
    padding: 30px;
    color: #999;
    font-style: italic;
  }
  
  .highlight-me {
    background: #fff3cd !important;
    border-radius: 8px;
  }
  
  .file-input-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-block;
    width: 100%;
  }
  
  .file-input-wrapper input[type=file] {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  
  .info-box {
    background: rgba(255,255,255,0.15);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 15px;
    text-align: center;
    line-height: 1.4;
  }
  
  @media (max-width: 380px) {
    h1 { font-size: 1.6rem; }
    .option { font-size: 0.85rem; padding: 15px 8px; min-height: 80px; }
    .question-box { font-size: 1rem; padding: 20px 15px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- TELA INICIAL -->
  <div id="screen-home" class="screen active">
    <h1>🧼 Quiz das Mãos</h1>
    <p class="subtitle">Higienização das Mãos<br>Aprendizagem Significativa (Ausubel)</p>
    <input type="text" id="playerName" placeholder="Digite seu nome" maxlength="20">
    <button class="btn btn-primary" onclick="startGame()">▶ Iniciar Jogo</button>
    <button class="btn btn-info" onclick="showScreen('screen-ranking'); renderRanking()">🏆 Ver Ranking</button>
    <button class="btn btn-warning" onclick="exportRanking()">📥 Exportar Ranking (.txt)</button>
    <div class="file-input-wrapper">
      <button class="btn btn-secondary">📤 Importar Ranking (.txt)</button>
      <input type="file" accept=".txt" onchange="importRanking(event)">
    </div>
    <div class="info-box">
      💡 5 perguntas • 30s cada • Pontuação por tempo<br>
      Quanto mais rápido, mais pontos!
    </div>
  </div>

  <!-- TELA DO QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <div class="question-counter" id="questionCounter">1/5</div>
      <div class="timer" id="timer">30</div>
      <div style="min-width:70px;text-align:right;">⭐ <span id="currentScore">0</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-box" id="questionBox">Pergunta</div>
    <div class="options" id="optionsBox"></div>
  </div>

  <!-- TELA DE RESULTADO DA PERGUNTA -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">✅</div>
      <div class="result-label" id="resultLabel">Resposta Correta!</div>
      <div class="points-gained" id="pointsGained">+850</div>
      <div class="result-label">pontos</div>
    </div>
    <button class="btn btn-primary" onclick="nextQuestion()">Próxima ➜</button>
  </div>

  <!-- TELA FINAL -->
  <div id="screen-final" class="screen">
    <h1>🎉 Fim de Jogo!</h1>
    <div class="result-card">
      <div class="result-label">Pontuação Final</div>
      <div class="points-gained" id="finalScore">0</div>
      <div class="result-label" id="finalPlayerName">Jogador</div>
    </div>
    <button class="btn btn-primary" onclick="showScreen('screen-ranking'); renderRanking()">🏆 Ver Ranking</button>
    <button class="btn btn-warning" onclick="restartGame()">🔄 Jogar Novamente</button>
    <button class="btn btn-info" onclick="exportRanking()">📥 Exportar Ranking (.txt)</button>
  </div>

  <!-- TELA RANKING -->
  <div id="screen-ranking" class="screen">
    <h1>🏆 Ranking</h1>
    <div class="ranking-list" id="rankingList"></div>
    <button class="btn btn-primary" onclick="showScreen('screen-home')">🏠 Voltar</button>
    <button class="btn btn-warning" onclick="exportRanking()">📥 Exportar (.txt)</button>
    <button class="btn btn-secondary" onclick="clearRanking()">🗑️ Limpar Ranking</button>
  </div>

</div>

<script>
// ========== BANCO DE PERGUNTAS ==========
const questions = [
  {
    q: "Em qual teoria de aprendizagem está ancorada a mini estratégia de ensino sobre higienização das mãos?",
    options: ["Behaviorismo de Skinner", "Aprendizagem Significativa de Ausubel", "Construtivismo de Piaget", "Ensino a Distância de Moran"],
    correct: 1
  },
  {
    q: "Qual é o PRIMEIRO passo da sequência didática de 6 passos proposta na aula?",
    options: ["Organizador prévio", "Situação-problema", "Ativar subsunçores", "Avaliação significativa"],
    correct: 2
  },
  {
    q: "Quantos são os 'Momentos' para higienização das mãos segundo a ANVISA?",
    options: ["3 momentos", "5 momentos", "7 momentos", "10 momentos"],
    correct: 1
  },
  {
    q: "Qual a duração recomendada para a FRICÇÃO ANTISÉPTICA com preparação alcoólica?",
    options: ["5 a 10 segundos", "20 a 30 segundos", "40 a 60 segundos", "90 a 120 segundos"],
    correct: 1
  },
  {
    q: "Qual profissional do século XIX demonstrou que a higiene das mãos reduziu a mortalidade materna?",
    options: ["Louis Pasteur", "Florence Nightingale", "Ignaz Semmelweis", "Robert Koch"],
    correct: 2
  }
];

// ========== ESTADO DO JOGO ==========
let currentPlayer = "";
let currentQuestion = 0;
let currentScore = 0;
let timeLeft = 30;
let timerInterval = null;
let questionStartTime = 0;
let answered = false;

// ========== RANKING (localStorage) ==========
function getRanking() {
  const data = localStorage.getItem("quizMaosRanking");
  return data ? JSON.parse(data) : [];
}

function saveRanking(ranking) {
  localStorage.setItem("quizMaosRanking", JSON.stringify(ranking));
}

function addPlayerToRanking(name, score) {
  const ranking = getRanking();
  ranking.push({
    name: name,
    score: score,
    date: new Date().toLocaleString("pt-BR")
  });
  ranking.sort((a, b) => b.score - a.score);
  saveRanking(ranking);
}

function renderRanking(highlightName = null) {
  const ranking = getRanking();
  const list = document.getElementById("rankingList");
  
  if (ranking.length === 0) {
    list.innerHTML = '<div class="empty-ranking">Nenhum jogador ainda.<br>Seja o primeiro! 🎯</div>';
    return;
  }
  
  list.innerHTML = ranking.slice(0, 20).map((p, i) => {
    const posClass = i < 3 ? `rank-${i+1}` : "";
    const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i+1) + "º";
    const highlight = (highlightName && p.name === highlightName) ? "highlight-me" : "";
    return `
      <div class="ranking-item ${highlight}">
        <div class="rank-position ${posClass}">${medal}</div>
        <div class="rank-name">${escapeHtml(p.name)}</div>
        <div class="rank-score">${p.score} pts</div>
      </div>
    `;
  }).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ========== EXPORTAR / IMPORTAR TXT ==========
function exportRanking() {
  const ranking = getRanking();
  if (ranking.length === 0) {
    alert("Ranking vazio! Jogue primeiro.");
    return;
  }
  
  let txt = "=====================================\n";
  txt += "   RANKING - QUIZ HIGIENIZAÇÃO DAS MÃOS\n";
  txt += "=====================================\n";
  txt += "Gerado em: " + new Date().toLocaleString("pt-BR") + "\n";
  txt += "Total de jogadores: " + ranking.length + "\n\n";
  txt += "POS  | PONTOS | NOME\n";
  txt += "-----|--------|------------------------\n";
  
  ranking.forEach((p, i) => {
    const pos = String(i+1).padStart(3, " ");
    const pts = String(p.score).padStart(6, " ");
    txt += `${pos}  | ${pts} | ${p.name} (${p.date})\n`;
  });
  
  txt += "\n=====================================\n";
  
  const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ranking_quiz_maos.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importRanking(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    // Tenta extrair entradas do formato exportado
    const regex = /\s*(\d+)\s*\|\s*(\d+)\s*\|\s*([^\(]+)\s*\(([^)]+)\)/g;
    let match;
    const imported = [];
    
    while ((match = regex.exec(content)) !== null) {
      imported.push({
        name: match[3].trim(),
        score: parseInt(match[2]),
        date: match[4].trim()
      });
    }
    
    if (imported.length === 0) {
      alert("Não foi possível ler o arquivo. Verifique o formato.");
      return;
    }
    
    // Mescla com ranking atual (evita duplicatas exatas)
    const current = getRanking();
    const merged = [...current];
    imported.forEach(newP => {
      const exists = merged.some(p => 
        p.name === newP.name && 
        p.score === newP.score && 
        p.date === newP.date
      );
      if (!exists) merged.push(newP);
    });
    
    merged.sort((a, b) => b.score - a.score);
    saveRanking(merged);
    alert(`${imported.length} jogador(es) importado(s) com sucesso!`);
    renderRanking();
  };
  reader.readAsText(file);
  event.target.value = "";
}

function clearRanking() {
  if (confirm("Tem certeza que deseja apagar TODO o ranking?")) {
    localStorage.removeItem("quizMaosRanking");
    renderRanking();
  }
}

// ========== NAVEGAÇÃO ==========
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ========== JOGO ==========
function startGame() {
  const name = document.getElementById("playerName").value.trim();
  if (!name) {
    alert("Digite seu nome para começar!");
    return;
  }
  currentPlayer = name;
  currentQuestion = 0;
  currentScore = 0;
  document.getElementById("currentScore").textContent = "0";
  showScreen("screen-quiz");
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = questions[currentQuestion];
  document.getElementById("questionCounter").textContent = `${currentQuestion + 1}/${questions.length}`;
  document.getElementById("questionBox").textContent = q.q;
  
  const colors = ["red", "blue", "yellow", "green"];
  const shapes = ["▲", "◆", "●", "■"];
  const optionsBox = document.getElementById("optionsBox");
  optionsBox.innerHTML = q.options.map((opt, i) => `
    <button class="option ${colors[i]}" onclick="selectAnswer(${i})">
      <span style="font-size:1.3rem;margin-right:5px;">${shapes[i]}</span>
      ${escapeHtml(opt)}
    </button>
  `).join("");
  
  timeLeft = 30;
  questionStartTime = Date.now();
  document.getElementById("timer").textContent = timeLeft;
  document.getElementById("timer").classList.remove("danger");
  document.getElementById("progressFill").style.width = "100%";
  
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
}

function tickTimer() {
  timeLeft--;
  const elapsed = (Date.now() - questionStartTime) / 1000;
  const percent = Math.max(0, ((30 - elapsed) / 30) * 100);
  document.getElementById("progressFill").style.width = percent + "%";
  document.getElementById("timer").textContent = timeLeft;
  
  if (timeLeft <= 10) {
    document.getElementById("timer").classList.add("danger");
  }
  
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      timeOut();
    }
  }
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  
  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll(".option");
  const elapsed = (Date.now() - questionStartTime) / 1000;
  
  buttons.forEach(b => b.disabled = true);
  
  if (index === q.correct) {
    buttons[index].classList.add("correct");
    const points = Math.max(100, Math.round(1000 - (elapsed * 30)));
    currentScore += points;
    document.getElementById("currentScore").textContent = currentScore;
    
    setTimeout(() => {
      document.getElementById("resultEmoji").textContent = "✅";
      document.getElementById("resultLabel").textContent = "Resposta Correta!";
      document.getElementById("pointsGained").textContent = "+" + points;
      showScreen("screen-result");
    }, 800);
  } else {
    buttons[index].classList.add("wrong");
    buttons[q.correct].classList.add("correct");
    
    setTimeout(() => {
      document.getElementById("resultEmoji").textContent = "❌";
      document.getElementById("resultLabel").textContent = "Resposta Errada!";
      document.getElementById("pointsGained").textContent = "+0";
      showScreen("screen-result");
    }, 1200);
  }
}

function timeOut() {
  answered = true;
  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll(".option");
  buttons.forEach(b => b.disabled = true);
  buttons[q.correct].classList.add("correct");
  
  setTimeout(() => {
    document.getElementById("resultEmoji").textContent = "⏰";
    document.getElementById("resultLabel").textContent = "Tempo Esgotado!";
    document.getElementById("pointsGained").textContent = "+0";
    showScreen("screen-result");
  }, 1000);
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) {
    finishGame();
  } else {
    showScreen("screen-quiz");
    loadQuestion();
  }
}

function finishGame() {
  addPlayerToRanking(currentPlayer, currentScore);
  document.getElementById("finalScore").textContent = currentScore;
  document.getElementById("finalPlayerName").textContent = currentPlayer;
  showScreen("screen-final");
}

function restartGame() {
  document.getElementById("playerName").value = "";
  showScreen("screen-home");
}

// Enter no input inicia o jogo
document.getElementById("playerName").addEventListener("keypress", function(e) {
  if (e.key === "Enter") startGame();
});
</script>

</body>
</html>
